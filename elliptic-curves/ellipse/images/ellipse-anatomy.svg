<text x="325.0" y="358" fill="#6A3FC9" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">a  (semi-major)</text>
<text x="624.0" y="354" fill="#1C7A50" font-size="18" font-weight="700" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">c</text>
<text x="486" y="286.4" fill="#1C7A50" font-size="18" font-weight="700" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif">b</text>
