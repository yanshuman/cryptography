<text x="30" y="42" fill="#16203A" font-size="22" font-weight="800" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">Anatomy of an ellipse</text>
<text x="30" y="66" fill="#56617C" font-size="15" font-weight="500" text-anchor="start" font-family="Segoe UI,Helvetica,Arial,sans-serif">a = 5, b = 3, c = 4, e = c/a = 0.8</text>
