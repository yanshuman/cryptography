<text x="970" y="598" fill="#16203A" font-size="17" font-weight="700" text-anchor="end" font-family="Segoe UI,Helvetica,Arial,sans-serif">r₁ + r₂ = 2a  for every point P</text>
<text x="30" y="598" fill="#16203A" font-size="17" font-weight="600" text-anchor="start" font-family="Consolas,monospace">x²/a² + y²/b² = 1</text>
