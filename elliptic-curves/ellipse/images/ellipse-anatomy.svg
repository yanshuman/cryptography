<text x="112.5" y="121.6" fill="#B23A26" font-size="13" font-weight="600" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif">directrix x = −a/e</text>
<line x1="887.5" y1="528.4" x2="887.5" y2="131.6" stroke="#B23A26" stroke-width="1.6" stroke-dasharray="7 5"/>
