<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="bt">
<title id="bt">Cryptography: RSA, visualized</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1730"/><stop offset="1" stop-color="#1B2550"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7D27A"/><stop offset="1" stop-color="#D9A33A"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9BBFF"/><stop offset="1" stop-color="#6E8BFF"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1280" height="400" rx="20" fill="url(#bg)"/>
<rect width="1280" height="400" rx="20" fill="url(#grid)"/>
<g font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#FFFFFF" fill-opacity=".09">
<text x="40" y="40">3233 = 61 × 53</text><text x="300" y="380">φ(n) = 3120</text><text x="1010" y="40">17 × 2753 ≡ 1</text>
<text x="1080" y="378">2790²⁷⁵³ mod 3233</text><text x="620" y="30">gcd(17, 3120) = 1</text><text x="40" y="380">65¹⁷ mod 3233</text>
</g>
<g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="72" y="150" font-size="22" font-weight="600" fill="#9AA5BE" letter-spacing="4">CRYPTOGRAPHY</text>
<text x="70" y="218" font-size="64" font-weight="800" fill="#FFFFFF">RSA, visualized</text>
<text x="72" y="262" font-size="21" fill="#C9D2E3">Key generation · encryption · signatures · attacks</text>
<text x="72" y="318" font-size="22" font-family="ui-monospace,Consolas,monospace" fill="url(#blue)">c = mᵉ mod n</text>
<text x="262" y="318" font-size="22" fill="#56617C">→</text>
<text x="296" y="318" font-size="22" font-family="ui-monospace,Consolas,monospace" fill="url(#gold)">m = cᵈ mod n</text>
</g>
<!-- public key -->
<g transform="translate(830,120) rotate(-18)">
<circle cx="0" cy="0" r="40" fill="none" stroke="url(#blue)" stroke-width="14"/>
<rect x="38" y="-7" width="130" height="14" rx="4" fill="url(#blue)"/>
<rect x="128" y="5" width="12" height="26" rx="3" fill="url(#blue)"/><rect x="150" y="5" width="12" height="18" rx="3" fill="url(#blue)"/>
<text x="0" y="6" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700" fill="#A9BBFF" text-anchor="middle">e</text>
</g>
<!-- padlock -->
<g transform="translate(1040,160)">
<path d="M-48,40 V0 a48,48 0 0 1 96,0 V40" fill="none" stroke="#C3A6FF" stroke-width="16" stroke-linecap="round"/>
<rect x="-78" y="34" width="156" height="128" rx="22" fill="#2A2148" stroke="#C3A6FF" stroke-width="3"/>
<circle cx="0" cy="88" r="14" fill="#C3A6FF"/><rect x="-6" y="92" width="12" height="36" rx="4" fill="#C3A6FF"/>
</g>
<!-- private key -->
<g transform="translate(860,300) rotate(12)">
<circle cx="0" cy="0" r="40" fill="none" stroke="url(#gold)" stroke-width="14"/>
<rect x="38" y="-7" width="130" height="14" rx="4" fill="url(#gold)"/>
<rect x="128" y="5" width="12" height="26" rx="3" fill="url(#gold)"/><rect x="150" y="5" width="12" height="18" rx="3" fill="url(#gold)"/>
<text x="0" y="6" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700" fill="#F7D27A" text-anchor="middle">d</text>
</g>
</svg>
