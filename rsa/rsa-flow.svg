<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahf" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahbf" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bgr" width="1100" height="930" rx="16"/>
<text class="lt" x="30" y="36" style="font-size:20px">RSA public-key cryptosystem</text>
<text class="ls" x="30" y="56">Lock with the public key, unlock with the private key. Sign with the private key, verify with the public key.</text>
<rect class="lane" x="14" y="72" width="1072" height="230" rx="14"/><text class="lt" x="30" y="98">1 · Key generation</text><text class="ls" x="1070" y="98" text-anchor="end">Alice does this once</text><rect class="lane" x="14" y="322" width="1072" height="132" rx="14"/><text class="lt" x="30" y="348">2 · Encryption</text><text class="ls" x="1070" y="348" text-anchor="end">Bob → Alice: keeps it secret</text><rect class="lane" x="14" y="472" width="1072" height="132" rx="14"/><text class="lt" x="30" y="498">3 · Digital signature</text><text class="ls" x="1070" y="498" text-anchor="end">Alice → Bob: proves who sent it</text><rect class="lane" x="14" y="624" width="1072" height="176" rx="14"/><text class="lt" x="30" y="650">4 · The attacker</text><text class="ls" x="1070" y="650" text-anchor="end">Eve sees only public values</text>
<path class="arrow " d="M335,144.0 L353,144.0" marker-end="url(#ah)"/><path class="arrow " d="M520,144.0 L538,144.0" marker-end="url(#ah)"/><path class="arrow " d="M705,144.0 L723,144.0" marker-end="url(#ah)"/><path class="arrow " d="M890,144.0 L908,144.0" marker-end="url(#ah)"/><path class="arrow " d="M992.5,176 L992.5,196 L437.5,196"/><path class="arrow " d="M437.5,196 L437.5,210" marker-end="url(#ah)"/><path class="arrow " d="M807.5,196 L807.5,210" marker-end="url(#ah)"/><path class="arrow " d="M335,398 L353,398" marker-end="url(#ah)"/><path class="arrow " d="M520,398 L538,398" marker-end="url(#ah)"/><path class="arrow " d="M705,398 L723,398" marker-end="url(#ah)"/><path class="arrow " d="M890,398 L908,398" marker-end="url(#ah)"/><path class="arrow " d="M910,548 L892,548" marker-end="url(#ah)"/><path class="arrow " d="M725,548 L707,548" marker-end="url(#ah)"/><path class="arrow " d="M540,548 L522,548" marker-end="url(#ah)"/><path class="arrow " d="M355,548 L337,548" marker-end="url(#ah)"/><path class="arrow pub" d="M437.5,268 L437.5,364" marker-end="url(#ah)"/><path class="arrow priv" d="M807.5,268 L807.5,364" marker-end="url(#ah)"/><path class="arrow danger" d="M622.5,580 L622.5,674" marker-end="url(#ahb)"/><path class="arrow danger" d="M705,708 L723,708" marker-end="url(#ahb)"/><path class="arrow danger" d="M890,708 L900,708 L900,687 L908,687" marker-end="url(#ahb)"/><path class="arrow danger" d="M900,708 L900,753 L908,753" marker-end="url(#ahb)"/>
<g class="node n" data-id="k1" tabindex="0" role="button" aria-label="Pick two primes: p = 61, q = 53"><rect x="170" y="112" width="165" height="64" rx="10"/><text class="t" x="252.5" y="138.0">Pick two primes</text><text class="s" x="252.5" y="159.0">p = 61, q = 53</text></g><g class="node pub" data-id="k2" tabindex="0" role="button" aria-label="Compute n: n = p × q = 3233"><rect x="355" y="112" width="165" height="64" rx="10"/><text class="t" x="437.5" y="138.0">Compute n</text><text class="s" x="437.5" y="159.0">n = p × q = 3233</text></g><g class="node priv" data-id="k3" tabindex="0" role="button" aria-label="Compute φ(n): (p−1)(q−1) = 3120"><rect x="540" y="112" width="165" height="64" rx="10"/><text class="t" x="622.5" y="138.0">Compute φ(n)</text><text class="s" x="622.5" y="159.0">(p−1)(q−1) = 3120</text></g><g class="node pub" data-id="k4" tabindex="0" role="button" aria-label="Choose e: gcd(e, φ) = 1 → 17"><rect x="725" y="112" width="165" height="64" rx="10"/><text class="t" x="807.5" y="138.0">Choose e</text><text class="s" x="807.5" y="159.0">gcd(e, φ) = 1 → 17</text></g><g class="node priv" data-id="k5" tabindex="0" role="button" aria-label="Find d: e·d ≡ 1 (mod φ) → 2753"><rect x="910" y="112" width="165" height="64" rx="10"/><text class="t" x="992.5" y="138.0">Find d</text><text class="s" x="992.5" y="159.0">e·d ≡ 1 (mod φ) → 2753</text></g><g class="node pub" data-id="pk" tabindex="0" role="button" aria-label="Public key (e, n): (17, 3233)"><rect x="355" y="212" width="165" height="56" rx="10"/><text class="t" x="437.5" y="234.0">Public key (e, n)</text><text class="s" x="437.5" y="255.0">(17, 3233)</text></g><g class="node priv" data-id="sk" tabindex="0" role="button" aria-label="Private key (d, n): (2753, 3233)"><rect x="725" y="212" width="165" height="56" rx="10"/><text class="t" x="807.5" y="234.0">Private key (d, n)</text><text class="s" x="807.5" y="255.0">(2753, 3233)</text></g><g class="node n" data-id="e1" tabindex="0" role="button" aria-label="Bob&#x27;s message m: m = 65  (&quot;A&quot;)"><rect x="170" y="366" width="165" height="64" rx="10"/><text class="t" x="252.5" y="392.0">Bob's message m</text><text class="s" x="252.5" y="413.0">m = 65  ("A")</text></g><g class="node pub" data-id="e2" tabindex="0" role="button" aria-label="Encrypt with e: c = mᵉ mod n = 2790"><rect x="355" y="366" width="165" height="64" rx="10"/><text class="t" x="437.5" y="392.0">Encrypt with e</text><text class="s" x="437.5" y="413.0">c = mᵉ mod n = 2790</text></g><g class="node priv" data-id="e4" tabindex="0" role="button" aria-label="Decrypt with d: m = cᵈ mod n = 65"><rect x="725" y="366" width="165" height="64" rx="10"/><text class="t" x="807.5" y="392.0">Decrypt with d</text><text class="s" x="807.5" y="413.0">m = cᵈ mod n = 65</text></g><g class="node ok" data-id="e5" tabindex="0" role="button" aria-label="Alice reads it: 65 → &quot;A&quot; ✓"><rect x="910" y="366" width="165" height="64" rx="10"/><text class="t" x="992.5" y="392.0">Alice reads it</text><text class="s" x="992.5" y="413.0">65 → "A" ✓</text></g><g class="node n" data-id="g1" tabindex="0" role="button" aria-label="Hash the message: h = H(m) = 123"><rect x="910" y="516" width="165" height="64" rx="10"/><text class="t" x="992.5" y="542.0">Hash the message</text><text class="s" x="992.5" y="563.0">h = H(m) = 123</text></g><g class="node priv" data-id="g2" tabindex="0" role="button" aria-label="Sign with d: s = hᵈ mod n = 2746"><rect x="725" y="516" width="165" height="64" rx="10"/><text class="t" x="807.5" y="542.0">Sign with d</text><text class="s" x="807.5" y="563.0">s = hᵈ mod n = 2746</text></g><g class="node pub" data-id="g4" tabindex="0" role="button" aria-label="Verify with e: sᵉ mod n = 123"><rect x="355" y="516" width="165" height="64" rx="10"/><text class="t" x="437.5" y="542.0">Verify with e</text><text class="s" x="437.5" y="563.0">sᵉ mod n = 123</text></g><g class="node ok" data-id="g5" tabindex="0" role="button" aria-label="Signature valid: 123 = H(m) ✓"><rect x="170" y="516" width="165" height="64" rx="10"/><text class="t" x="252.5" y="542.0">Signature valid</text><text class="s" x="252.5" y="563.0">123 = H(m) ✓</text></g><g class="node net" data-id="ch" tabindex="0" role="button" aria-label="Public network: anyone can listen"><rect x="540" y="366" width="165" height="214" rx="12"/><text class="t" x="622.5" y="390">Public network</text><text class="s" x="622.5" y="410">c = 2790</text><g class="ico net" transform="translate(611.5,451.0)"><path d="M5,12 V8 a6,6 0 0 1 12,0 V12" fill="none" stroke="currentColor" stroke-width="2.4" class="lockarc"/><rect x="1" y="12" width="20" height="16" rx="3"/></g><text class="s" x="622.5" y="495.0">anyone can listen</text><text class="s" x="622.5" y="544">(m, s = 2746)</text><text class="t" x="622.5" y="566" style="font-size:12px">internet · Wi-Fi · email</text></g><g class="node bad" data-id="a1" tabindex="0" role="button" aria-label="Eve intercepts: e, n, c, s"><rect x="540" y="676" width="165" height="64" rx="10"/><text class="t" x="622.5" y="702.0">Eve intercepts</text><text class="s" x="622.5" y="723.0">e, n, c, s</text></g><g class="node bad" data-id="a2" tabindex="0" role="button" aria-label="Must factor n: n = p × q → φ → d"><rect x="725" y="676" width="165" height="64" rx="10"/><text class="t" x="807.5" y="702.0">Must factor n</text><text class="s" x="807.5" y="723.0">n = p × q → φ → d</text></g><g class="node bad" data-id="a3" tabindex="0" role="button" aria-label="Toy key: broken: 3233 = 61 × 53"><rect x="910" y="660" width="165" height="54" rx="10"/><text class="t" x="992.5" y="681.0">Toy key: broken</text><text class="s" x="992.5" y="702.0">3233 = 61 × 53</text></g><g class="node ok" data-id="a4" tabindex="0" role="button" aria-label="2048-bit key: safe: ~617 digits, infeasible"><rect x="910" y="726" width="165" height="54" rx="10"/><text class="t" x="992.5" y="747.0">2048-bit key: safe</text><text class="s" x="992.5" y="768.0">~617 digits, infeasible</text></g>
<g class="av ok"><circle cx="46" cy="154" r="17"/><text x="46" y="159">A</text></g><text class="lt" x="72" y="153" style="font-size:13.5px">Alice</text><text class="ls" x="72" y="169">receiver</text><g class="av pub"><circle cx="46" cy="398" r="17"/><text x="46" y="403">B</text></g><text class="lt" x="72" y="397" style="font-size:13.5px">Bob</text><text class="ls" x="72" y="413">sender</text><g class="av ok"><circle cx="46" cy="548" r="17"/><text x="46" y="553">A</text></g><text class="lt" x="72" y="547" style="font-size:13.5px">Alice</text><text class="ls" x="72" y="563">signer</text><g class="av bad"><circle cx="46" cy="708" r="17"/><text x="46" y="713">E</text></g><text class="lt" x="72" y="707" style="font-size:13.5px">Eve</text><text class="ls" x="72" y="723">attacker</text><text class="ls" x="170" y="696">Everything Eve can see is in the</text><text class="ls" x="170" y="713">dashed purple box. Without d she</text><text class="ls" x="170" y="730">cannot decrypt c or forge s.</text>
<rect class="card" x="14" y="818" width="1072" height="66" rx="14"/><text class="lt" x="30" y="842">Why decryption works</text><text class="math" x="30" y="868">e·d = 1 + k·φ(n)  ⇒  (mᵉ)ᵈ = m · (m^φ(n))ᵏ ≡ m · 1ᵏ = m  (mod n)</text><text class="ls" x="1070" y="868" text-anchor="end">Euler's theorem · here 17 × 2753 = 1 + 15 × 3120</text>
